services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lottus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: lottus
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U lottus"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: {context: ., target: worker}
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://lottus:${POSTGRES_PASSWORD}@db:5432/lottus
    command: [node, --import, tsx, scripts/migrate.ts]
    depends_on: {db: {condition: service_healthy}}
  web:
    build: {context: ., target: web}
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://lottus:${POSTGRES_PASSWORD}@db:5432/lottus
    ports: ["127.0.0.1:3000:3000"]
    depends_on: {migrate: {condition: service_completed_successfully}}
    restart: unless-stopped
  worker:
    build: {context: ., target: worker}
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://lottus:${POSTGRES_PASSWORD}@db:5432/lottus
    depends_on: {migrate: {condition: service_completed_successfully}}
    restart: unless-stopped
volumes:
  postgres:
